# Supabase CLI 配置（supabase link 后 project_id 会被替换为你的项目）
project_id = "glimmer-translate"

[auth]
# 验证邮件、重置密码邮件中的链接最终跳到这里：云端返回页的“邮箱已验证”
site_url = "https://btaihodwxgyhtbyjhbke.supabase.co/functions/v1/billing-return?status=verified"
# 扩展用 chrome.identity 做第三方登录，授权后跳回 https://<扩展ID>.chromiumapp.org/supabase
additional_redirect_urls = ["https://*.chromiumapp.org/**"]

# Google 登录：OAuth 客户端（Web application 类型）的 ID 和密钥写在 supabase/.env（已被 git 忽略）；
# 没有该文件时本地启动会因缺少变量而失败，可临时改为 enabled = false
# 授权回调地址填 http://127.0.0.1:54321/auth/v1/callback（本地）或 https://<项目>.supabase.co/auth/v1/callback（云端）
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
# 注册需要邮箱验证；本地开发可改为 false
[auth.email]
enable_confirmations = true

# Stripe webhook 由 Stripe 调用，没有用户 JWT，需关闭 JWT 校验（改用 Stripe 签名校验）
[functions.stripe-webhook]
verify_jwt = false

# 支付返回页是浏览器直接打开的公开页面
[functions.billing-return]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true
