<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>邮箱验证 · 微光翻译</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="welcome.css" />
    <style>
      .result {
        max-width: 460px;
        margin: 12vh auto 0;
        text-align: center;
      }
      .result .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 28px;
        color: #fff;
        background: linear-gradient(135deg, #9b7bff, #5b4cf0);
      }
      .result.err .icon {
        background: linear-gradient(135deg, #f59e0b, #b45309);
      }
      .result h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      .result p {
        margin: 0 0 8px;
        color: var(--muted);
        line-height: 1.7;
      }
      .result .detail {
        font-size: 12px;
      }
      .result .btn {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="../icons/icon48.png" alt="" /><span>微光翻译</span></div>
    </header>
    <main>
      <section class="card result" id="result">
        <div class="icon" id="icon">✓</div>
        <h1 id="title">邮箱已验证</h1>
        <p id="text">回到正在阅读的网页，点击浏览器工具栏的微光翻译图标打开面板，用邮箱和密码登录即可。</p>
        <p class="detail" id="detail" hidden></p>
        <button class="btn primary" id="close">关闭此页面</button>
      </section>
    </main>
    <script src="verified.js"></script>
  </body>
</html>
