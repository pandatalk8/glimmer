<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>微光翻译</title>
    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" />
        <span>微光翻译</span>
      </div>
      <button id="openOptions" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
      </button>
    </header>

    <section class="card lang-card">
      <select id="sourceLang"></select>
      <button id="swap" class="swap" title="交换语言">⇄</button>
      <select id="targetLang"></select>
    </section>

    <section class="card row">
      <label for="engine">翻译服务</label>
      <select id="engine"></select>
    </section>

    <button id="toggle" class="primary big">
      <span id="toggleText">翻译此页面</span>
      <kbd>Alt+A</kbd>
    </button>

    <div class="seg" id="displayMode">
      <button data-v="bilingual">双语对照</button>
      <button data-v="translation">仅显示译文</button>
    </div>

    <section class="card list">
      <label class="sw-row"><span>总是翻译 <b id="hostName">此网站</b></span><input type="checkbox" class="sw" id="alwaysSite" /></label>
      <label class="sw-row"><span>显示悬浮球</span><input type="checkbox" class="sw" id="floatBall" /></label>
      <label class="sw-row"><span>划词翻译</span><input type="checkbox" class="sw" id="selection" /></label>
    </section>

    <section class="card quick">
      <textarea id="quickInput" rows="2" placeholder="输入文字，Enter 翻译（中英自动互译）"></textarea>
      <div id="quickOut" class="quick-out" hidden></div>
    </section>

    <p id="note" class="note" hidden></p>

    <footer class="foot">
      <a href="#" id="shortcuts">快捷键</a>
      <span>·</span>
      <a href="#" id="optionsLink">更多设置</a>
      <span class="ver" id="ver"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
